<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buyora - E-Commerce</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">

    <div class="logo">
        <span class="logo-main">B</span>
        <span class="logo-text">UYORA</span>
        <div class="logo-line"></div>
    </div>

    <div class="cart-area">
        🛒 Cart <span id="cart-count">0</span>
    </div>

</header>


<section class="welcome">

    <div class="welcome-content">

        <p class="welcome-small">WELCOME TO</p>

        <h1>
            Discover More.<br>
            <span>Choose Better.</span>
        </h1>

        <p class="slogan">
            Everything you want, just a click away.
        </p>

        <button
            class="explore-btn"
            onclick="document.getElementById('shop').scrollIntoView({behavior:'smooth'})">
            Explore Products ↓
        </button>

    </div>


    <div class="welcome-decoration">

        <div class="floating-circle circle-one"></div>
        <div class="floating-circle circle-two"></div>

        <div class="hero-cart">

            <div class="cart-handle"></div>

            <div class="cart-body">

                <div class="cart-product product-one">
                    <div class="product-label">BUY</div>
                </div>

                <div class="cart-product product-two">
                    <div class="product-label">ORA</div>
                </div>

                <div class="cart-product product-three">
                    <div class="product-label">+</div>
                </div>

            </div>

            <div class="cart-bottom"></div>

            <div class="cart-wheel wheel-one"></div>
            <div class="cart-wheel wheel-two"></div>

        </div>

    </div>

</section>


<main>

<section id="shop" class="shop-section">

    <h2>Explore Our Products</h2>

    <p class="shop-subtitle">
        Find something you'll love.
    </p>

    <div class="filters">

        <input
            type="text"
            id="search"
            placeholder="Search products..."
            onkeyup="filterProducts()"
        >

        <select
            id="category"
            onchange="filterProducts()"
        >
            <option value="all">All Categories</option>
            <option value="electronics">Electronics</option>
            <option value="accessories">Accessories</option>
        </select>

    </div>

    <div class="products" id="products">
    </div>

</section>


<section class="cart-section">

    <h2>Shopping Cart</h2>

    <div id="cart-items">
        <p class="empty-cart">Your cart is empty.</p>
    </div>

    <div class="cart-total">

        <h3>
            Total: ₹<span id="total">0</span>
        </h3>

        <button onclick="clearCart()" class="clear-btn">
            Clear Cart
        </button>

    </div>


    <div class="checkout">

        <h2>Checkout</h2>

        <input
            type="text"
            id="customer-name"
            placeholder="Enter your name"
        >

        <input
            type="email"
            id="customer-email"
            placeholder="Enter your email"
        >

        <input
            type="text"
            id="customer-address"
            placeholder="Enter your address"
        >

        <button onclick="placeOrder()">
            Place Order
        </button>

    </div>


    <div id="order-message"></div>

</section>

</main>


<footer>

    <p>
        © 2026 Buyora | Industry Practice Project
    </p>

</footer>


<script src="script.js"></script>

</body>
</html>
